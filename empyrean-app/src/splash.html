<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Empyrean</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Italianno&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    cursor: default;
  }

  .splash {
    width: 100vw; height: 100vh;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(33, 54, 140, 0.55), transparent 65%),
      radial-gradient(ellipse at 75% 80%, rgba(201, 169, 97, 0.18), transparent 55%),
      linear-gradient(180deg, #060B2E 0%, #0A1340 50%, #182763 100%);
    border-radius: 12px;
    border: 1px solid rgba(201, 169, 97, 0.25);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }

  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.5) 0px, transparent 1.2px),
      radial-gradient(circle at 28% 8%, rgba(255,255,255,0.35) 0px, transparent 1px),
      radial-gradient(circle at 47% 24%, rgba(255,255,255,0.55) 0px, transparent 1.4px),
      radial-gradient(circle at 73% 12%, rgba(255,255,255,0.4) 0px, transparent 1px),
      radial-gradient(circle at 88% 28%, rgba(255,255,255,0.45) 0px, transparent 1.2px),
      radial-gradient(circle at 16% 62%, rgba(255,255,255,0.3) 0px, transparent 1px),
      radial-gradient(circle at 38% 78%, rgba(255,255,255,0.35) 0px, transparent 1px),
      radial-gradient(circle at 64% 55%, rgba(255,255,255,0.45) 0px, transparent 1.2px),
      radial-gradient(circle at 82% 71%, rgba(255,255,255,0.35) 0px, transparent 1px);
  }

  .content {
    position: relative; z-index: 2;
    text-align: center;
    animation: fadeIn 0.8s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(229, 203, 142, 0.8);
    font-weight: 600;
    margin-bottom: 24px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .eyebrow::before, .eyebrow::after {
    content: ''; width: 36px; height: 1px;
    background: rgba(201, 169, 97, 0.5);
  }

  .script {
    font-family: 'Italianno', cursive;
    font-size: 92px;
    color: #FAF6EE;
    line-height: 0.9;
    filter: drop-shadow(0 4px 20px rgba(10, 19, 64, 0.5));
  }

  .cap-row {
    display: flex; align-items: baseline; justify-content: center; gap: 14px;
    margin-top: 14px;
  }
  .cap-row .vellum {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #FAF6EE;
    font-weight: 500;
    text-indent: 0.4em;
  }
  .cap-row .dot { color: rgba(201, 169, 97, 0.5); font-size: 8px; }
  .cap-row .gold {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #E5CB8E;
    font-weight: 500;
    text-indent: 0.4em;
  }

  .tagline {
    font-family: 'Cinzel', serif;
    font-style: normal;
    font-size: 9px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(250, 246, 238, 0.55);
    margin-top: 36px;
    font-weight: 500;
  }

  .loader {
    margin-top: 36px;
    width: 80px; height: 1px;
    background: rgba(201, 169, 97, 0.2);
    position: relative;
    overflow: hidden;
  }
  .loader::after {
    content: '';
    position: absolute;
    left: -40%; top: 0; width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent 0%, #C9A961 50%, transparent 100%);
    animation: loadSlide 1.4s ease-in-out infinite;
  }
  @keyframes loadSlide {
    0% { left: -40%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>
<div class="splash">
  <div class="stars"></div>
  <div class="content">
    <div class="eyebrow">A Beatific Vision Application</div>
    <div class="script">Beatific&nbsp;Vision</div>
    <div class="cap-row">
      <span class="vellum">Vision</span>
      <span class="dot">·</span>
      <span class="gold">Empyrean</span>
    </div>
    <div class="tagline">Per visum, ad gloriam.</div>
    <div class="loader"></div>
  </div>
</div>
</body>
</html>
